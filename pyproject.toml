[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "cclproyect"
version = "0.0.1"
description = "es estimar la profundidad del pozo midiante el ccl"
authors = [
  { name = "Ilustra/Dipole" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.10.9",
    "mkdocs",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pip",
    "python-dotenv",
    "ruff",
    "seaborn>=0.13.2",
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["cclproyect"]
include = ["pyproject.toml", "cclproyect/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["cclproyect"]
force-sort-within-sections = true

